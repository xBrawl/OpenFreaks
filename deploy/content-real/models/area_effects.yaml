- name: karity_titan_slam
  type_name: effect
  radius: 1
  time_ms: 1300
# Титан выпускает хватальщиков из ладоней.
- name: karity_titan_summon
  type_name: effect
  radius: 1
  time_ms: 1500
# Перекат шара: зона — в конце полосы, полоса идёт от шара к ней.
- name: karity_roll_lane
  type_name: effect
  radius: 1
  time_ms: 2400


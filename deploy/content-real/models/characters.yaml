# ── НОВЫЕ РЕЖИМЫ (26.09) ─────────────────────────────────────────────────
# mode_hero: в меню не выбирается и бандл не обязателен (для клиента это
# миньон), но в бою сервер ведёт его как героя и так же шлёт в снимке
# (sim/modes.go, snapshot.go: свой тип героя в кадре).

# КОШМАР В КАТАКОМБАХ (sim/nightmare.go): у всех восьмерых одна модель —
# «Исследователь», роль знает только сервер. Навыки — пустые слоты: нож

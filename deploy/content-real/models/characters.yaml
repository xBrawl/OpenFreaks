# Телевизор помех Кролика (ульта). Стоит на месте, неуязвим и не теряет
# здоровье; убрать его может только новый телевизор (ульта переставляет).
# Пока стоит — раз в global_damage_interval_ms бьёт ВСЕХ врагов на карте
# на global_damage, где бы они ни были (sim/rabbit.go).
- name: rabbit_tv_character
  hero_type_name: minion_building
  weapon_skill_name: rabbit_tv_weapon
  ultimate_skill_name: rabbit_tv_dummy
  speed: 0
  hit_points: 4400
  collision_radius: 170
  projectile_start_z: 560
  rabbit_tv: true
  invulnerable: true
  global_damage: 750
  global_damage_interval_ms: 1500
  replaces_previous: true


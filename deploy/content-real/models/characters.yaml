# Классы (role_name): tank, support, artillery, control, fighter, assassin, marksman.
# КРОЛИК — база для новых персонажей: модель своя, навыки и эффекты сменные
# (сейчас — лазер и телевизор помех). Именно default_character, а не новое имя:
# старые APK считают бандл каждого героя обязательным, а этот у них уже есть.
- name: default_character
  rarity_name: common
  role_name: control
  hero_type_name: hero
  weapon_skill_name: rabbit_laser
  ultimate_skill_name: rabbit_tv
  speed: 720
  hit_points: 3400
  ultimate_charge_multiplier: 110
  # Урон телевизора считается уроном ульты, но заряжает её в полную силу:
  # попадания телевизора копят Кролику следующий телевизор.
  ultimate_charge_ultimate_multiplier: 100
  charge_ultimate_automatically: 0
  collision_radius: 120
  projectile_start_z: 450
  # Первый телевизор готов с начала боя (sim/build.go).
  ultimate_ready_at_start: true


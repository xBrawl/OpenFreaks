# понимает, какую атаку начинает босс.
# Взмах рукой по полосе ближе к камере / дальше от камеры (зона — в центре полосы).
- name: karity_titan_sweep_front
  type_name: effect
  radius: 1
  time_ms: 1900
- name: karity_titan_sweep_back
  type_name: effect
  radius: 1
  time_ms: 1900

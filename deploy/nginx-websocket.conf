# Include inside the existing HTTPS server block. The websocket paths expose no
# internal allocation/results API. Go listeners bind to loopback only.
location = /freaks/ws/main {
    proxy_pass http://127.0.0.1:9729/ws/main;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 150s;
    proxy_send_timeout 15s;
    client_max_body_size 64k;
}
location = /freaks/ws/battle {
    proxy_pass http://127.0.0.1:9730/ws/battle;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 15s;
    client_max_body_size 64k;
}

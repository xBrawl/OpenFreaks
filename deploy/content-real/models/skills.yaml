# DEFAULT CHARACTER
- name: default_character_weapon
  behaviour:
    type: attack
    attack:
      type: projectile
      projectile_name: default_character_projectile
      damage: 300
      ms_between_attacks: 100
      spread: 60
      num_bullets_in_one_attack: 5
  recharge_time: 1500
